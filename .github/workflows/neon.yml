name: EroDist KDE neon
on:
  push:
    branches: [arena/a42c77fd-erodist]
    paths: ['neon/**', 'scripts/neon-*', 'packages/neon-*/**', '.github/workflows/neon.yml', 'tests/test_neon.py']
permissions:
  contents: write
  checks: write
concurrency:
  group: erodist-neon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: python3 -m unittest discover -s tests -q
      - name: Install ISO inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools gnupg
      - name: Inspect official upstream distribution
        run: |
          set -o pipefail
          bash scripts/neon-audit.sh 2>&1 | tee /tmp/neon-audit.log
      - name: Upload native Qt inspection artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EroDist-neon-Qt-inspection-not-an-ISO
          path: artifacts/
          retention-days: 7
      - name: Record audit output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_id=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "audit") | .id' | head -1)
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('/tmp/neon-audit.log').read_text(errors='replace')[-55000:]
          Path('/tmp/neon-output.json').write_text(json.dumps({'output': {'title':'KDE neon upstream audit','summary':'Upstream inspection, not an ISO release.','text':'```text\n'+text+'\n```'}}))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input /tmp/neon-output.json
