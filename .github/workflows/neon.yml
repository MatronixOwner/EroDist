name: EroDist clean neon ISO
on:
  push:
    branches: [arena/a42c77fd-erodist]
    paths: ['neon/**', 'scripts/neon-clean-iso.sh', '.github/workflows/neon.yml']
permissions:
  contents: write
  checks: write
concurrency:
  group: erodist-neon-clean-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: contains(github.event.head_commit.message, '[neon-iso]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso gnupg
      - name: Prepare verified clean base ISO
        run: |
          set -o pipefail
          bash scripts/neon-clean-iso.sh 2>&1 | tee /tmp/neon-clean.log
      - name: One ZIP with one complete ISO
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: EroDist-clean-start-neon-ISO
          path: artifacts/neon-clean/*.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish verification and download information
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.archive.outputs.artifact-digest }}
        run: |
          tag="neon-clean-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/neon-release.md <<EOF_NOTES
          # Чистый старт EroDist на KDE neon
          По решению пользователя начинаем с нуля: этот ISO — **неизменённая официальная KDE neon Desktop User Edition**, без прежних редакций Home/Pro/Program, центра управления и других пакетов EroDist. Это базовый образ, не готовая кастомизация EroDist.

          [Скачать один ZIP с полным ISO]($ARTIFACT_URL). Нужен вход в GitHub. Хранение: 14 дней; точный срок указан в Actions. Распакуйте и запишите находящийся внутри ISO. Части и скрипты сборки не нужны.

          SHA256 ZIP: \`$ARTIFACT_DIGEST\`.

          SHA256 исходного ISO и подпись GPG проверены. Найдены загрузочные записи BIOS/UEFI, штатные Plasma и Calamares; старых пакетов EroDist нет. Полная загрузка, установка в VM и Hyper-V в этой сборке не проверены.
          EOF_NOTES
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "EroDist: чистая база KDE neon" --notes-file /tmp/neon-release.md build/neon-clean/SHA256SUMS build/neon-clean/verification.json build/neon-clean/upstream.sig
          cat /tmp/neon-release.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record diagnostic output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.archive.outputs.artifact-digest }}
        run: |
          check_id=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "build") | .id' | head -1)
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          log=Path('/tmp/neon-clean.log')
          text=log.read_text(errors='replace')[-45000:] if log.exists() else 'Failed before preparation.'
          summary='Clean upstream base, no previous EroDist customization.\n\nZIP: '+os.environ.get('ARTIFACT_URL','')+'\n\nZIP SHA256: '+os.environ.get('ARTIFACT_DIGEST','')
          Path('/tmp/neon-check.json').write_text(json.dumps({'output':{'title':'Clean neon ISO verification','summary':summary,'text':'```text\n'+text+'\n```'}}))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input /tmp/neon-check.json
