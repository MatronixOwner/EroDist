name: Build EroDist Mint ISO
on:
  push:
    branches: [arena/a42c77fd-erodist]
    paths: ['mint/**', 'packages/**', 'scripts/**', 'tests/**', 'site/deploy.json', '.github/workflows/iso.yml']
  workflow_dispatch:
    inputs:
      upload_url:
        description: Temporary session ISO download server URL (leave empty for normal build)
        required: false
        default: ''
      upload_token:
        description: Single-use session ingest token
        required: false
        default: ''
permissions:
  contents: write
  checks: write
concurrency:
  group: erodist-iso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ inputs.upload_url == '' && !contains(github.event.head_commit.message, '[publish-download]') && !contains(github.event.head_commit.message, '[iso-zip]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Test verified remaster and ISO assembly helpers
        run: python3 -m unittest discover -s tests -v
      - name: Prepare ephemeral build runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools dconf-cli gnupg curl xvfb xauth python3-pil initramfs-tools-core file lz4 zstd
          df -h .
      - name: Verify original Mint and build Cinnamon editions image
        run: |
          set -o pipefail
          sudo bash scripts/build.sh 2>&1 | tee /tmp/erodist-build.log
      - name: Verify all downloadable assets and size limits
        run: |
          (cd artifacts && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('artifacts').iterdir())
          assert any(p.name.endswith('.iso') or '.iso.part' in p.name for p in files)
          for p in files:
              assert p.stat().st_size < 2147483648, f'Asset exceeds GitHub limit: {p}'
          PY
      - name: Publish complete ISO in one ZIP
        id: iso_archive
        uses: actions/upload-artifact@v4
        with:
          name: EroDist-1.0.0-RC2-Cinnamon-ISO
          path: archive/*.iso
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP_URL: ${{ steps.iso_archive.outputs.artifact-url }}
          ZIP_SHA256: ${{ steps.iso_archive.outputs.artifact-digest }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mint/source.json"))["release"])')
          tag="test-${version}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/release-notes.py > /tmp/release-notes.md
          gh release create "$tag" artifacts/* --target "$GITHUB_SHA" --prerelease \
            --title "EroDist ${version} — кандидат в релиз" --notes-file /tmp/release-notes.md
          printf '[Скачать один ZIP с готовым ISO](%s)\n\nZIP SHA256: `%s`\n' "$ZIP_URL" "$ZIP_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_id=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "build") | .id' | head -1)
          python3 - <<'PY'
          import json
          from pathlib import Path
          log=Path('/tmp/erodist-build.log')
          text=log.read_text(errors='replace')[-45000:] if log.exists() else 'Failed before ISO build; see workflow steps.'
          Path('/tmp/check-output.json').write_text(json.dumps({'output': {'title':'Mint remaster failure','summary':'See diagnostic tail below.','text':'```text\n'+text+'\n```'}}))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input /tmp/check-output.json

  publish-download:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_url != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-download]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Assemble verified release and deliver to temporary server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/publish-download.py 2>&1 | tee /tmp/erodist-transfer.log
      - name: Attach transfer failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_id=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "publish-download") | .id' | head -1)
          python3 - <<'PYDIAG'
          import json, os
          from pathlib import Path
          p=Path('/tmp/erodist-transfer.log')
          text=p.read_text(errors='replace')[-30000:] if p.exists() else 'Failed before transfer.'
          text=text.replace(os.environ['GH_TOKEN'], '[REDACTED]')
          Path('/tmp/transfer-output.json').write_text(json.dumps({'output': {'title':'ISO transfer failure','summary':'Diagnostic tail','text':'```text\n'+text+'\n```'}}))
          PYDIAG
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input /tmp/transfer-output.json

  iso-zip:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[iso-zip]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Download and verify already published ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bash scripts/prepare-iso-zip.sh 2>&1 | tee /tmp/iso-zip.log
      - name: Publish one ZIP containing one complete ISO
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: EroDist-0.9-Cinnamon-ISO
          path: published-iso/erodist-0.9.0-mint1-cinnamon-amd64.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Record download link
        env:
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.archive.outputs.artifact-digest }}
        run: |
          printf '## Single ZIP with complete ISO\n\n[Download ZIP](%s)\n\nContains one complete ISO, not split parts. GitHub sign-in required. Retention: 7 days.\n\nArchive SHA256: `%s`\n' "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach archive failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_id=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "iso-zip") | .id' | head -1)
          python3 - <<'PYDIAG'
          import json, os
          from pathlib import Path
          p=Path('/tmp/iso-zip.log')
          text=p.read_text(errors='replace')[-25000:] if p.exists() else 'Failed before assembly.'
          text=text.replace(os.environ['GH_TOKEN'], '[REDACTED]')
          Path('/tmp/zip-output.json').write_text(json.dumps({'output': {'title':'ISO ZIP failure','summary':'See assembly diagnostics; upload errors are in Actions logs.','text':'```text\n'+text+'\n```'}}))
          PYDIAG
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input /tmp/zip-output.json
