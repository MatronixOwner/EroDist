name: Build EroDist ISO
on:
  push:
    branches: [arena/a42c77fd-erodist]
    paths:
      - 'archiso/**'
      - 'scripts/**'
      - 'tests/**'
      - 'scripts/build.sh'
      - '.github/workflows/iso.yml'
  workflow_dispatch:
permissions:
  contents: write
  checks: write
concurrency:
  group: erodist-iso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Validate source configuration
        run: python3 -m unittest discover -s tests -v
      - name: Build Arch Linux ISO in privileged container
        run: |
          set -o pipefail
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:latest bash -euxo pipefail -c '
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm archiso archinstall python
              bash scripts/build.sh
            ' 2>&1 | tee /tmp/erodist-build.log
      - name: Attach failure details to check
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_id=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "build") | .id' | head -1)
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          text = Path('/tmp/erodist-build.log').read_text(errors='replace')[-45000:]
          Path('/tmp/check-output.json').write_text(json.dumps({'output': {'title': 'ISO build failure', 'summary': 'Build failed; diagnostic tail below.', 'text': '```text\n' + text + '\n```'}}))
          PYTHON
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input /tmp/check-output.json
      - name: Check ISO and release size limit
        run: |
          test -s artifacts/erodist-0.7.0-arch1-x86_64.iso
          (cd artifacts && sha256sum -c SHA256SUMS)
          test "$(stat -c %s artifacts/erodist-0.7.0-arch1-x86_64.iso)" -lt 2147483648
          file artifacts/*.iso
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="test-0.7.0-arch1-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" artifacts/*.iso artifacts/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "EroDist 0.7.0-arch1 — test ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Тестовая новая база Arch Linux / XFCE, x86_64. Установщик: текстовый Archinstall с профилем EroDist XFCE, нужен интернет. Не обновляет Debian-установку. BIOS и UEFI (Secure Boot отключить). Пользователь: tester, пароль: live. Начните с VM: 2 CPU, 4 GB RAM, 25 GB диск. Установка может удалить данные! Проверяйте SHA256SUMS. Исходный commit: ${GITHUB_SHA}. Загрузка, установка и Hyper-V ещё требуют ручной проверки."
